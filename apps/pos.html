<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>nexFlavor POS</title>
<style>
  :root{--ink:#1A1A1A;--paper:#FFF3E6;--cream:#FFF7E3;--red:#BF0D1A;--signal:#E83A2F;--orange:#EC7E3C;--glow:#FFBF5B;--gray:#808080;--radius:12px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,sans-serif;background:var(--paper);color:var(--ink);display:grid;grid-template-columns:1fr 380px;height:100vh;-webkit-font-smoothing:antialiased}
  header{grid-column:1/-1;background:var(--ink);color:var(--cream);padding:16px 28px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.15)}
  h1{font-size:18px;font-weight:700;letter-spacing:1px}
  #clock{font-size:13px;color:#aaa;font-variant-numeric:tabular-nums}
  #queue{padding:22px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
  .order{background:var(--cream);border-radius:var(--radius);padding:16px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.05);transition:.15s}
  .order:hover{box-shadow:0 4px 14px rgba(0,0,0,.1);transform:translateY(-1px)}
  .order.sel{box-shadow:0 0 0 2px var(--red)}
  .order .top{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
  .order .top .amt{color:var(--red)}
  .order .st{font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:1px;margin-top:4px}
  aside{background:var(--ink);color:var(--cream);padding:24px;display:flex;flex-direction:column;overflow:hidden}
  aside h2{font-size:15px;font-weight:700;letter-spacing:1px;color:var(--glow);margin-bottom:14px}
  #detail{flex:1;overflow-y:auto;font-size:14px}
  #detail li{list-style:none;display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #333}
  #due{font-size:26px;font-weight:700;padding:14px 0;border-top:2px solid var(--glow)}
  label{font-size:12px;color:#999;display:block;margin-top:12px;letter-spacing:.5px}
  select,input{width:100%;padding:10px;border-radius:8px;border:0;font-size:15px;margin-top:6px}
  #change{font-size:15px;color:var(--glow);padding:8px 0;min-height:26px}
  #pay{background:var(--red);color:#fff;border:0;padding:16px;font-size:16px;font-weight:700;border-radius:var(--radius);cursor:pointer;margin-top:12px;transition:.15s}
  #pay:hover:not(:disabled){background:var(--signal)}
  #pay:disabled{background:var(--gray);cursor:not-allowed}
  #msg{font-size:13px;color:var(--glow);padding:8px 0;min-height:20px}
  .empty{color:#999;font-size:13px}
</style>
</head>
<body>
<header><h1>Cashier POS</h1><span id="clock"></span></header>
<div id="queue"></div>
<aside>
  <h2>PAYMENT</h2>
  <ul id="detail"><li class="empty">Select an order</li></ul>
  <div id="due">₱0.00</div>
  <label>MODE</label>
  <select id="mode"><option>Cash</option><option>Credit Card</option></select>
  <label>TENDERED</label>
  <input id="tendered" type="number" step="0.01" value="0">
  <div id="change"></div>
  <div id="msg"></div>
  <button id="pay" disabled>TAKE PAYMENT</button>
</aside>
<script>
const API="http://localhost:8000/api";
let orders=[],sel=null;

setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString(),1000);

async function load(){
  const f=encodeURIComponent('["name","grand_total","custom_kitchen_status","status"]');
  const fl=encodeURIComponent('[["docstatus","=",1],["custom_kitchen_status","!=","Served"]]');
  const r=await fetch(`${API}/resource/Sales%20Order?fields=${f}&filters=${fl}&limit_page_length=0&order_by=creation asc`);
  orders=(await r.json()).data||[];
  document.getElementById('queue').innerHTML=orders.length?orders.map(o=>`
    <div class="order ${sel===o.name?'sel':''}" onclick="pick('${o.name}')">
      <div class="top"><span>${o.name.replace('SAL-ORD-','')}</span><span class="amt">₱${o.grand_total.toFixed(2)}</span></div>
      <div class="st">${o.custom_kitchen_status||'New'} - ${o.status}</div>
    </div>`).join(''):'<p style="color:#999">No open orders</p>';
}

async function pick(name){
  sel=name;load();
  const d=(await (await fetch(`${API}/resource/Sales%20Order/${name}`)).json()).data;
  document.getElementById('detail').innerHTML=d.items.map(i=>
    `<li><span>${i.qty}× ${i.item_name}</span><span>₱${i.amount.toFixed(2)}</span></li>`).join('');
  document.getElementById('due').textContent='₱'+d.grand_total.toFixed(2);
  document.getElementById('tendered').value=d.grand_total.toFixed(2);
  document.getElementById('pay').disabled=false;
  window.cur=d;calc();
}

function calc(){
  if(!window.cur)return;
  const c=parseFloat(document.getElementById('tendered').value||0)-window.cur.grand_total;
  document.getElementById('change').textContent=c>=0?'Change: ₱'+c.toFixed(2):'Short ₱'+Math.abs(c).toFixed(2);
}
document.getElementById('tendered').oninput=calc;

document.getElementById('pay').onclick=async()=>{
  const btn=document.getElementById('pay'),msg=document.getElementById('msg');
  btn.disabled=true;msg.textContent='Posting invoice…';
  const d=window.cur;
  const inv={
    customer:d.customer,is_pos:1,docstatus:1,pos_profile:"nexFlavor Counter",set_posting_time:1,
    items:d.items.map(i=>({item_code:i.item_code,qty:i.qty,rate:i.rate,sales_order:d.name,so_detail:i.name})),
    payments:[{mode_of_payment:document.getElementById("mode").value,amount:d.grand_total}],paid_amount:d.grand_total,base_paid_amount:d.grand_total
  };
  try{
    const r=await fetch(`${API}/resource/POS%20Invoice`,{
      method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(inv)});
    const j=await r.json();
    if(j.data){
      msg.textContent='✓ '+j.data.name+' paid';
      await fetch(`${API}/resource/Sales%20Order/${d.name}`,{
        method:'PUT',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({custom_kitchen_status:"Served"})});
      sel=null;window.cur=null;
      document.getElementById('detail').innerHTML='<li class="empty">Select an order</li>';
      document.getElementById('due').textContent='₱0.00';
      load();
    }else{msg.textContent='✗ '+(j.exception||'failed').slice(0,90);btn.disabled=false}
  }catch(e){msg.textContent='✗ '+e.message;btn.disabled=false}
};

load();setInterval(load,5000);
</script>
</body>
</html>
