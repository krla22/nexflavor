services:
  kong:
    image: kong:3.8
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong:/kong:ro
    ports:
      - "8000:8000"
      - "8001:8001"
    networks:
      - frappe_network

networks:
  frappe_network:
    external: true
    name: frappe_docker_frappe_network
